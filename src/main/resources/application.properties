spring.application.name=sistema-medico

# --- Conexion a PostgreSQL (base local que ya creE) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/sistema_medico
spring.datasource.username=postgres
spring.datasource.password=progra2-2026

# --- JPA / Hibernate ---
# El esquema lo controla Flyway, NO Hibernate. Por eso "validate" y no "update".
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Thymeleaf ---
# false en desarrollo: ves los cambios en las vistas sin reiniciar la app
spring.thymeleaf.cache=false

# --- Servidor ---
server.port=8080

# --- Seguridad: bloqueo por intentos fallidos (RN-GLOBAL-007 / RN-CU00-03) ---
app.security.max-login-attempts=5
app.security.lock-duration-minutes=15

# -- Horario de trabajo fijo igual para todos los medico
hospital.schedule.start-time=08:00
hospital.schedule.end-time=17:00
hospital.schedule.slot-duration-minutes=30

#--- Correo (Gmail SMTP) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true