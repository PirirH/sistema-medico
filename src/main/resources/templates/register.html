<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro de Paciente')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container narrow">
    <h1>Registro de Paciente</h1>
    <p>Complete sus datos para habilitar el agendamiento de citas médicas.</p>

    <p th:if="${registrationError}" class="error-text" th:text="${registrationError}"></p>

    <form th:action="@{/registro}" th:object="${registrationForm}" method="post" class="form">

        <label for="dpi">DPI</label>
        <input type="text" id="dpi" th:field="*{dpi}" maxlength="13">
        <p class="error-text" th:if="${#fields.hasErrors('dpi')}" th:errors="*{dpi}"></p>

        <label for="fullName">Nombre Completo</label>
        <input type="text" id="fullName" th:field="*{fullName}">
        <p class="error-text" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

        <label for="phone">Teléfono</label>
        <input type="text" id="phone" th:field="*{phone}" maxlength="8">
        <p class="error-text" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>

        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" th:field="*{email}">
        <p class="error-text" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="insuranceNumber">Número de Seguro Médico (opcional)</label>
        <input type="text" id="insuranceNumber" th:field="*{insuranceNumber}">
        <p class="error-text" th:if="${#fields.hasErrors('insuranceNumber')}" th:errors="*{insuranceNumber}"></p>

        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" th:field="*{username}" maxlength="9">
        <p class="error-text" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

        <label for="password">Contraseña</label>
        <input type="password" id="password" th:field="*{password}">
        <p class="error-text" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button type="submit" class="btn btn-primary">Registrarme</button>
    </form>
</main>
</body>
</html>
