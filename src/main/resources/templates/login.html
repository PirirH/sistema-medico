<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar Sesión')}"></head>
<body>
<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="container narrow">
    <h1>Iniciar Sesión</h1>

    <p th:if="${registrationSuccess}" class="success-text">
        Registro completado exitosamente. Ya puede iniciar sesión.
    </p>
    <p th:if="${logoutMessage}" class="success-text" th:text="${logoutMessage}"></p>
    <p th:if="${errorMessage}" class="error-text" th:text="${errorMessage}"></p>

    <form th:action="@{/login}" method="post" class="form">
        <label for="username">Usuario</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
    </form>

    <p class="admin-link">
        ¿Es personal del hospital? Use el mismo formulario con su usuario y contraseña asignados.
    </p>
</main>
</body>
</html>
