<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Hospital Central'">Hospital Central</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header th:fragment="navbar" class="navbar">
    <a th:href="@{/}" class="navbar-brand">🏥 Hospital Central</a>
    <nav>
        <a th:href="@{/}">Inicio</a>
        <a sec:authorize="hasRole('PACIENTE')" th:href="@{/paciente/dashboard}">Mi Cuenta</a>
        <a sec:authorize="isAuthenticated() and !hasRole('PACIENTE')" th:href="@{/admin/dashboard}">Mi Panel</a>
        <a sec:authorize="!isAuthenticated()" th:href="@{/login}">Iniciar Sesión</a>
        <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="navbar-logout">
            <button type="submit" class="btn-link">Cerrar Sesión</button>
        </form>
    </nav>
</header>
</body>
</html>
